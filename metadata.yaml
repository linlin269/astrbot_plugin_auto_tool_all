name: astrbot_plugin_auto_tool_all
display_name: Auto Tool All
short_desc: 内置 AnySearch 联网检索，并支持全局工具编排、媒体转发、接口测速、QQ 头像生图与上下文清理。
desc: >-
  内置 AnySearch 实时联网搜索、批量搜索、公开网页正文提取和站点/垂直搜索，
  支持无 API Key 的访客模式；通过自然语言调用 AstrBot 中已注册的 LLM 工具，
  并支持未来插件动态加入；工具返回中的图片/视频自动下载并以 base64 消息转发
  （带大小上限与失败回退）；支持对 OpenAI 兼容接口（如中转站）的
  “查看模型列表”与“逐模型测速”；在 aiocqhttp/OneBot v11 上可获取机器人、
  发送者和被@用户的 QQ 头像，并把消息图、引用图及搜索结果图片接力给生图工具；
  提供管理员专属的会话上下文清理指令（立即 / 定时 / 全部会话），
  重启后自动向管理员私聊汇报。
version: v0.3.1
author: AstrBot Community
# 发布前必改：换成你的实际仓库地址，WebUI 检查插件更新依赖这个字段。
repo: https://github.com/linlin269/astrbot_plugin_auto_tool_all
astrbot_version: ">=4.13.0,<5"
support_platforms:
  - aiocqhttp
  - webchat
tags:
  - llm-tool
  - web-search
  - tool-orchestration
  - image
  - video
  - avatar
  - api-probe
  - session-management
