name: astrbot_plugin_auto_tool_all
display_name: Auto Tool All
short_desc: 用自然语言编排 AstrBot 全局工具，支持 QQ 头像参考生图与上下文清理。
desc: >-
  通过自然语言调用 AstrBot 中已注册的 LLM 工具，支持未来插件动态加入；
  在 aiocqhttp/OneBot v11 上可获取机器人、发送者和被@用户的 QQ 头像，
  并把消息图、引用图及搜索结果图片接力给生图工具；
  提供管理员专属的会话上下文清理指令（立即 / 定时 / 全部会话），
  重启后自动向管理员私聊汇报。
version: v0.2.0
author: AstrBot Community
# 发布前必改：换成你的实际仓库地址，WebUI 检查插件更新依赖这个字段。
repo: https://github.com/linlin269/astrbot_plugin_auto_tool_all
astrbot_version: ">=4.13.0,<5"
support_platforms:
  - aiocqhttp
  - webchat
tags:
  - llm-tool
  - tool-orchestration
  - image
  - avatar
  - session-management
